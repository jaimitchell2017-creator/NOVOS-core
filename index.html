<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVOS Accounts</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, #243b7a 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #512b78 0, transparent 35%),
        #070914;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      background: linear-gradient(135deg, #6577ff, #a855f7);
      box-shadow: 0 0 40px #6675ff55;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #aeb5cc;
    }

    .card {
      background: rgba(17, 21, 34, 0.9);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 80px rgba(0,0,0,.5);
    }

    .tabs {
      display: flex;
      gap: 8px;
      background: #080b14;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .tabs button {
      flex: 1;
      border: 0;
      border-radius: 9px;
      padding: 11px;
      background: transparent;
      color: #9ca5bd;
      cursor: pointer;
      font-weight: bold;
    }

    .tabs button.active {
      background: #252c43;
      color: white;
    }

    label {
      display: block;
      font-size: 13px;
      color: #b7bfd4;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.12);
      background: #080b14;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #7583ff;
      box-shadow: 0 0 0 3px #7583ff22;
    }

    button.primary {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, #6374ff, #9a55f7);
    }

    button.secondary {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      color: white;
      background: rgba(255,255,255,.05);
      cursor: pointer;
    }

    .status {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      color: #aeb5cc;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .pill {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #6675ff22;
      color: #bfc6ff;
      font-size: 12px;
    }

    .info {
      padding: 14px;
      background: #080b14;
      border-radius: 13px;
      margin: 10px 0;
      word-break: break-word;
    }

    .muted {
      color: #929ab0;
      font-size: 12px;
    }

    footer {
      text-align: center;
      color: #727a90;
      font-size: 11px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">N</div>
    <h1>NOVOS Accounts</h1>
    <div class="subtitle">
      One account for the NOVOS ecosystem.
    </div>
  </div>

  <!-- LOGIN -->
  <div class="card" id="authCard">

    <div class="tabs">
      <button id="loginTab"
              class="active"
              onclick="showMode('login')">
        Sign in
      </button>

      <button id="signupTab"
              onclick="showMode('signup')">
        Create account
      </button>
    </div>

    <form id="authForm">

      <div id="displayNameWrap" class="hidden">
        <label>Display name</label>

        <input
          id="displayName"
          type="text"
          placeholder="Your name">
      </div>

      <label>Email</label>

      <input
        id="email"
        type="email"
        required
        placeholder="you@example.com">

      <label>Password</label>

      <input
        id="password"
        type="password"
        required
        minlength="6"
        placeholder="••••••••">

      <button
        class="primary"
        id="submitButton"
        type="submit">

        Sign in with NOVOS

      </button>

      <button
        class="secondary"
        type="button"
        onclick="resetPassword()">

        Forgot password?

      </button>

      <div
        class="status"
        id="status">
      </div>

    </form>

  </div>


  <!-- ACCOUNT -->
  <div
    class="card hidden"
    id="accountCard">

    <span class="pill">
      NOVOS Account
    </span>

    <h2 id="welcome">
      Welcome
    </h2>


    <div class="info">

      <div class="muted">
        Email
      </div>

      <div id="accountEmail"></div>

    </div>


    <div class="info">

      <div class="muted">
        NOVOS Account ID
      </div>

      <div id="accountId"></div>

    </div>


    <div class="info">

      <div class="muted">
        Display name
      </div>

      <div id="accountName"></div>

    </div>


    <h3>
      Connected Apps
    </h3>

    <div class="info muted">

      No connected apps yet.

      The NOVOS authorization system will be
      connected here next.

    </div>


    <button
      class="primary"
      onclick="signOut()">

      Sign out

    </button>

    <div
      class="status"
      id="accountStatus">
    </div>

  </div>


  <footer>
    NOVOS Accounts • Powered by NOVOS Core
  </footer>

</div>


<script>

const SUPABASE_URL =
  "https://ckagvbacdesdhunacdts.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7JryDJaO6H0Me254sN-xkg_xLd2x5gX";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let mode = "login";


function showMode(next) {

  mode = next;

  document
    .getElementById("loginTab")
    .classList
    .toggle("active", next === "login");

  document
    .getElementById("signupTab")
    .classList
    .toggle("active", next === "signup");

  document
    .getElementById("displayNameWrap")
    .classList
    .toggle("hidden", next !== "signup");

  document
    .getElementById("submitButton")
    .textContent =
      next === "login"
        ? "Sign in with NOVOS"
        : "Create NOVOS Account";

  document
    .getElementById("status")
    .textContent = "";
}


async function submitAuth(event) {

  event.preventDefault();

  const status =
    document.getElementById("status");

  status.textContent =
    "Connecting to NOVOS Accounts...";


  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const displayName =
    document
      .getElementById("displayName")
      .value
      .trim();


  let result;


  if (mode === "signup") {

    result =
      await client.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {

            full_name:
              displayName ||
              email.split("@")[0]

          }

        }

      });

  } else {

    result =
      await client.auth.signInWithPassword({

        email: email,

        password: password

      });

  }


  if (result.error) {

    status.textContent =
      result.error.message;

    return;

  }


  if (
    mode === "signup" &&
    !result.data.session
  ) {

    status.textContent =
      "Account created! Check your email to confirm your NOVOS Account.";

    return;

  }


  status.textContent = "";

  await loadAccount();

}


async function loadAccount() {

  const {
    data: { user }
  } =
    await client.auth.getUser();


  if (!user) {

    document
      .getElementById("authCard")
      .classList
      .remove("hidden");

    document
      .getElementById("accountCard")
      .classList
      .add("hidden");

    return;

  }


  const {
    data: profile
  } =
    await client
      .from("profiles")
      .select(
        "display_name, username, novos_email"
      )
      .eq("id", user.id)
      .maybeSingle();


  const name =
    profile?.display_name ||
    user.user_metadata?.full_name ||
    user.email?.split("@")[0] ||
    "NOVOS User";


  document
    .getElementById("welcome")
    .textContent =
      "Welcome, " + name;


  document
    .getElementById("accountEmail")
    .textContent =
      user.email || "Not set";


  document
    .getElementById("accountId")
    .textContent =
      user.id;


  document
    .getElementById("accountName")
    .textContent =
      name;


  document
    .getElementById("authCard")
    .classList
    .add("hidden");


  document
    .getElementById("accountCard")
    .classList
    .remove("hidden");

}


async function signOut() {

  await client.auth.signOut();

  document
    .getElementById("accountStatus")
    .textContent =
      "Signed out.";

  setTimeout(
    loadAccount,
    300
  );

}


async function resetPassword() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const status =
    document
      .getElementById("status");


  if (!email) {

    status.textContent =
      "Enter your email address first.";

    return;

  }


  const { error } =
    await client.auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            window.location.pathname
        }
      );


  status.textContent =
    error
      ? error.message
      : "Password reset email sent.";

}


document
  .getElementById("authForm")
  .addEventListener(
    "submit",
    submitAuth
  );


client.auth.onAuthStateChange(
  () => loadAccount()
);


loadAccount();

</script>

</body>
</html>
